name: API contract

# Every Polymarket read the app makes, against the real API, daily. The Data API
# v1 retirement (410) went unnoticed: panes swallow fetch errors and mocked tests
# keep passing. A failing run here is the alarm; see runbook/README.md.
on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract:
    name: Live data-api contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v8.3.0
        with:
          python-version: "3.12"
      - name: Live contract test
        run: uv run pytest -q -m live -o addopts=""

      - name: Report failure to Telegram
        if: failure()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: |
          curl -sf "https://api.telegram.org/bot$TELEGRAM_BOT_TOKEN/sendMessage" \
            -d chat_id=8851680837 \
            --data-urlencode "text=NOTE  tui  Polymarket API contract FAILED: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
