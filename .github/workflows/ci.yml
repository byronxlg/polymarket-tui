name: CI

# Lint and tests on every push to main and every pull request. Before this
# existed the only test run was the one inside publish.yml, so a break was
# found at release time rather than at merge time.
#
# Caveat: the blog and shorts crons open and merge their PRs with
# GITHUB_TOKEN, and events created with that token do not trigger workflows,
# so those runs are not gated by this one. Their diffs are site/docs files,
# which this workflow does not cover anyway.
on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Lint and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v8.3.0
        with:
          python-version: "3.12"
      - name: Lint
        run: uv run ruff check src/ tests/
      - name: Test
        run: uv run pytest -q
